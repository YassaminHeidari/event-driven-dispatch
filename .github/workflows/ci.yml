name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Real infrastructure for the integration tests.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dispatch
          POSTGRES_USER: dispatch
          POSTGRES_PASSWORD: dispatch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dispatch -d dispatch"
          --health-interval 3s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s --health-timeout 3s --health-retries 30
      kafka:
        # Default config: single-node KRaft broker that advertises localhost:9092.
        image: apache/kafka:3.8.0
        ports: ["9092:9092"]
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s --health-timeout 10s --health-retries 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run all tests
        run: |
          set -o pipefail
          mvn -B -ntp verify 2>&1 | tee build.log

      - name: Show failure details
        if: failure()
        run: python3 scripts/ci_failure_summary.py build.log

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: "**/target/surefire-reports/"
          if-no-files-found: ignore

  compose:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Start the whole stack with one command
        run: docker compose up -d --build

      - name: Submit jobs and wait for the results
        run: python3 scripts/smoke_test.py http://localhost:8080

      - name: Show service logs
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail 150 > compose.log 2>&1 || true
          python3 scripts/ci_failure_summary.py compose.log

      - name: Stop the stack
        if: always()
        run: docker compose down -v
