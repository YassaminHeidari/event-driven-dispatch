<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatch – live jobs</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --text:#e6e8ee; --muted:#8a93a6;
          --ok:#3fb68b; --warn:#e0a43a; --bad:#e5544b; --info:#5b8def; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:18px 24px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:17px; margin:0 12px 0 0; }
  main { display:grid; grid-template-columns: 1fr 300px; gap:16px; padding:16px 24px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 10px; }
  table { width:100%; border-collapse:collapse; font-variant-numeric: tabular-nums; }
  td, th { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:500; }
  td.detail { white-space:normal; color:var(--muted); max-width:320px; }
  .pill { padding:2px 8px; border-radius:999px; font-size:12px; border:1px solid currentColor; }
  .PENDING,.DISPATCHED { color:var(--muted); } .RUNNING { color:var(--info); } .RETRYING { color:var(--warn); }
  .COMPLETED { color:var(--ok); } .FAILED { color:var(--bad); }
  button, select, input { background:#1f2430; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font:inherit; }
  button { cursor:pointer; } button:hover { border-color:var(--info); }
  #conn { font-size:12px; color:var(--muted); margin-left:auto; }
  .stat { display:flex; justify-content:space-between; padding:4px 0; }
  .stat b { font-variant-numeric: tabular-nums; }
  code { color:var(--muted); }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Event-driven dispatch</h1>
  <select id="type">
    <option value="echo">echo – succeeds</option>
    <option value="flaky">flaky – fails 2×, then succeeds</option>
    <option value="fail">fail – goes to dead-letter topic</option>
  </select>
  <input id="count" type="number" min="1" max="500" value="1" style="width:80px" title="How many jobs">
  <button id="send">Submit</button>
  <span id="conn">connecting…</span>
</header>
<main>
  <section>
    <h2>Jobs (live via WebSocket)</h2>
    <table>
      <thead><tr><th>Job</th><th>Type</th><th>Status</th><th>Attempt</th><th>Worker</th><th>Latency</th><th>Detail</th></tr></thead>
      <tbody id="jobs"></tbody>
    </table>
  </section>
  <div>
    <section style="margin-bottom:16px">
      <h2>Pipeline</h2>
      <div id="stats"></div>
    </section>
    <section>
      <h2>Workers (Redis heartbeats)</h2>
      <div id="workers"></div>
    </section>
  </div>
</main>
<script>
const jobs = new Map();
const tbody = document.getElementById('jobs');
const MAX_ROWS = 100;

function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function latency(j) {
  if (!j.completedAt || !j.createdAt) return '';
  return (new Date(j.completedAt) - new Date(j.createdAt)) + ' ms';
}

function upsert(job) {
  jobs.set(job.id, job);
  let row = document.getElementById('job-' + job.id);
  if (!row) {
    row = document.createElement('tr');
    row.id = 'job-' + job.id;
    tbody.prepend(row);
    while (tbody.children.length > MAX_ROWS) {
      const last = tbody.lastElementChild; jobs.delete(last.id.slice(4)); last.remove();
    }
  }
  row.innerHTML = `<td><code>${esc(job.id.slice(0, 8))}</code></td><td>${esc(job.type)}</td>
    <td><span class="pill ${esc(job.status)}">${esc(job.status)}</span></td><td>${job.attempts || ''}</td>
    <td>${esc(job.workerId)}</td><td>${latency(job)}</td><td class="detail">${esc(job.detail)}</td>`;
}

function connect() {
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/jobs');
  const conn = document.getElementById('conn');
  ws.onopen = () => conn.textContent = 'live ●';
  ws.onclose = () => { conn.textContent = 'reconnecting…'; setTimeout(connect, 1000); };
  ws.onmessage = e => upsert(JSON.parse(e.data));
}

async function submit() {
  const type = document.getElementById('type').value;
  const n = Math.max(1, Math.min(500, +document.getElementById('count').value || 1));
  const payload = type === 'flaky' ? { failTimes: 2 } : { durationMs: 50 };
  await Promise.all(Array.from({ length: n }, () =>
    fetch('/api/jobs', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type, payload }) }).then(r => r.json()).then(upsert)));
}

async function refresh() {
  try {
    const s = await (await fetch('/api/jobs/stats')).json();
    document.getElementById('stats').innerHTML = [
      ['Total jobs', s.total], ['In flight', s.inFlight], ['Completed', s.completed], ['Failed (DLT)', s.failed],
      ['End-to-end p50', s.endToEndP50Ms.toFixed(1) + ' ms'], ['End-to-end p99', s.endToEndP99Ms.toFixed(1) + ' ms'],
    ].map(([k, v]) => `<div class="stat"><span>${k}</span><b>${v}</b></div>`).join('');
    const w = await (await fetch('/api/workers')).json();
    document.getElementById('workers').innerHTML = w.length ? w.map(x =>
      `<div class="stat"><span><code>${esc(x.id)}</code></span><b>${esc(x.state.processed)} done · ${esc(x.state.inFlight)} busy</b></div>`
    ).join('') : '<span style="color:var(--muted)">no live workers</span>';
  } catch (e) { /* the API may be starting */ }
}

document.getElementById('send').onclick = submit;
fetch('/api/jobs?limit=30').then(r => r.json()).then(list => list.reverse().forEach(upsert)).catch(() => {});
connect();
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
