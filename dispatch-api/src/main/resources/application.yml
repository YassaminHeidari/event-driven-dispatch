server:
  port: 8080
  tomcat:
    threads:
      max: 200

spring:
  application:
    name: dispatch-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dispatch}
    username: ${DB_USER:dispatch}
    password: ${DB_PASSWORD:dispatch}
    hikari:
      maximum-pool-size: 30
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 2
    consumer:
      auto-offset-reset: earliest
    listener:
      concurrency: 3

dispatch:
  outbox:
    batch-size: 500
    poll-interval-ms: 20
    retention-minutes: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    org.apache.kafka: WARN
